# Settings for the App Health Agent (Kibana Agent Builder, Elastic 9.4).
kibana_space: default

agent:
  id: app-health-agent
  name: App Health Agent
  description: >-
    Health checks, issue finding and root-cause analysis for a named application
    or component, using only the logs, metrics and traces indices registered for
    it in the component table.
  avatar_color: "#54B399"
  avatar_symbol: AH
  labels: [observability, app-health]

# The component table (one row per component) and custom checks.
components_index: app-health-components
checks_index: app-health-checks
default_schema: otel             # otel | ecs; can be overridden per component row

tool_prefix: apphealth
default_lookback_minutes: 60

# Built-in tools the agent may use. execute_esql runs the stored queries.
# Do NOT add platform.core.search / platform.core.list_indices (cluster-wide search).
platform_tools:
  - platform.core.execute_esql
  - platform.core.get_index_mapping

# Kibana feature privileges granted by `components.py role`.
role_kibana_features:
  agentBuilder: [read]
  actions: [read]
