# Agent-level settings for the Kibana Agent Builder agent.
kibana_space: default            # Kibana space the agent + tools are created in
agent:
  id: app-health-agent
  name: App Health Agent
  description: >-
    Checks health, finds issues and performs root-cause analysis for a named
    application, using only the Elasticsearch indices registered for that app.
  avatar_color: "#54B399"
  avatar_symbol: AH
  labels: [observability, app-health]

registry_index: app-health-registry   # small index holding the app -> indices catalog
tool_prefix: apphealth               # every generated tool id starts with this
default_lookback_minutes: 60

# Extra built-in platform tools given to the agent.
# platform.core.execute_esql / get_index_mapping let the agent run ad-hoc ES|QL
# for deeper RCA. The instructions restrict it to registered indices, but the
# LLM *can* technically query any index the user can read. For hard
# enforcement, give chat users the generated role (see README, step 5).
# Leave out platform.core.search and platform.core.list_indices: those are the
# tools that encourage cluster-wide searching.
extra_platform_tools:
  - platform.core.execute_esql
  - platform.core.get_index_mapping
